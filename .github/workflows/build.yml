name: Combined Security Scans (Separate Frontend/Backend)

on:
  push:
    branches: [main, feature-projectScan, add-JWT-config]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  #SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: nusiss_projectmanagementportal

jobs:
  backend-snyk:
    if: false
    name: Backend Snyk Scans
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: login
            path: project-portal-backend/springBoot_login/demo
          - name: project
            path: project-portal-backend/springBoot_project/demo
          - name: scan
            path: project-portal-backend/springBoot_scan/demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('{0}/pom.xml', matrix.service.path)) }}
          restore-keys: ${{ runner.os }}-m2

      - name: Remove Maven wrapper files
        working-directory: ${{ matrix.service.path }}
        run: |
          mv mvnw mvnw.bak 2>/dev/null || echo "No mvnw file found"
          mv mvnw.cmd mvnw.cmd.bak 2>/dev/null || echo "No mvnw.cmd file found"
          echo "Maven wrapper files renamed. Snyk will use system Maven."

      - name: Install Snyk globally
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ env.SNYK_TOKEN }}
      
      - name: Verify Snyk
        run: snyk whoami

      - name: Run Snyk test (${{ matrix.service.name }})
        timeout-minutes: 20
        working-directory: ${{ matrix.service.path }}
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          snyk test --file=pom.xml --severity-threshold=high --fail-on=upgradable --print-dep -d
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

      - name: Snyk monitor (${{ matrix.service.name }})
        if: github.event_name == 'push'
        working-directory: ${{ matrix.service.path }}
        run: snyk monitor --file=pom.xml --project-name=${{ github.repository }}-${{ matrix.service.name }}
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

      - name: Restore Maven wrapper files
        if: always()
        working-directory: ${{ matrix.service.path }}
        run: |
          mv mvnw.bak mvnw 2>/dev/null || true
          mv mvnw.cmd.bak mvnw.cmd 2>/dev/null || true

  frontend-snyk:
    if: false
    name: Frontend Snyk Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: project-portal-frontend/package-lock.json

      - name: Install dependencies
        working-directory: project-portal-frontend
        run: npm ci

      - name: Install Snyk globally
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ env.SNYK_TOKEN }}

      - name: Verify Snyk
        run: snyk whoami

      - name: Snyk test (Frontend)
        working-directory: project-portal-frontend
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          snyk test --severity-threshold=high --fail-on=upgradable -d
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

      - name: Snyk monitor (Frontend)
        if: github.event_name == 'push'
        working-directory: project-portal-frontend
        run: snyk monitor --project-name=${{ github.repository }}-frontend
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

  dependency-scan:
    if: false
    name: Consolidated Dependency Scan
    runs-on: ubuntu-latest
    needs: [backend-snyk, frontend-snyk]
    #if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Install Snyk globally
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Verify Snyk
        run: snyk --version

      - name: Scan Login Service
        working-directory: project-portal-backend/springBoot_login/demo
        run: |
          mv mvnw mvnw.bak 2>/dev/null || true
          snyk test --file=pom.xml --severity-threshold=high --debug || true
          mv mvnw.bak mvnw 2>/dev/null || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Scan Project Service
        working-directory: project-portal-backend/springBoot_project/demo
        run: |
          mv mvnw mvnw.bak 2>/dev/null || true
          snyk test --file=pom.xml --severity-threshold=high --debug || true
          mv mvnw.bak mvnw 2>/dev/null || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Scan Scan Service
        working-directory: project-portal-backend/springBoot_scan/demo
        run: |
          mv mvnw mvnw.bak 2>/dev/null || true
          snyk test --file=pom.xml --severity-threshold=high --debug || true
          mv mvnw.bak mvnw 2>/dev/null || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Scan Frontend
        working-directory: project-portal-frontend
        run: snyk test --severity-threshold=high --debug || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  # =============================================
  # NEW: DOCKER BUILD & PUSH TO ECR
  # =============================================
  docker-build-push:
    name: Build Docker Images & Push to ECR
    runs-on: ubuntu-latest
    #needs: [backend-snyk, frontend-snyk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/add-JWT-config'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_JWT_BRANCH }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_JWT_BRANCH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

        
      # Login Service
      - name: Build, tag, and push login-service
        working-directory: project-portal-backend/springBoot_login/demo
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:login-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:login-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-latest
          docker tag ${{ env.ECR_REPOSITORY }}:login-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-${{ github.sha }}
      
      # Project Service
      - name: Build, tag, and push project-service
        working-directory: project-portal-backend/springBoot_project/demo
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:project-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:project-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-latest
          docker tag ${{ env.ECR_REPOSITORY }}:project-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-${{ github.sha }}
      
      # Scan Service
      - name: Build, tag, and push scan-service
        working-directory: project-portal-backend/springBoot_scan/demo
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:scan-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:scan-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-latest
          docker tag ${{ env.ECR_REPOSITORY }}:scan-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-${{ github.sha }}

      # Same-origin: the frontend's Nginx proxies /api/* to the backend containers
      - name: Create frontend .env
        working-directory: project-portal-frontend
        run: |
          echo "REACT_APP_LOGIN_API_URL=/api" > .env
          echo "REACT_APP_PROJECT_API_URL=/api" >> .env
          echo "REACT_APP_SCAN_API_URL=/api" >> .env
      - name: Verify frontend .env
        working-directory: project-portal-frontend
        run: |
          cat .env

      # Frontend
      - name: Build, tag, and push frontend
        working-directory: project-portal-frontend
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:frontend-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:frontend-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-latest
          docker tag ${{ env.ECR_REPOSITORY }}:frontend-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}

      - name: Output image URIs
        run: |
          echo "Login Service: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-${{ github.sha }}"
          echo "Project Service: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-${{ github.sha }}"
          echo "Scan Service: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-${{ github.sha }}"
          echo "Frontend: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}"
  # =============================================
  # DEPLOY: 3 backend EC2s first (reached through the web EC2 as SSH jump host),
  # then the web EC2 (frontend/Nginx + SonarQube). If a backend fails, the web
  # EC2 is left untouched.
  # =============================================
  deploy-backends:
    name: Deploy ${{ matrix.role }} EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/add-JWT-config'
    concurrency:
      group: deploy-${{ matrix.role }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: login
            host_secret: LOGIN_HOST
            service: login-service
            health: wget -qO- http://localhost:8081/health
          - role: project
            host_secret: PROJECT_HOST
            service: project-service
            health: wget -qO- http://localhost:8082/health
          - role: scan
            host_secret: SCAN_HOST
            service: scan-service
            health: curl -fs http://localhost:8083/health

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH (jump through the web EC2)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host web
            HostName ${{ secrets.EC2_HOST }}
            User ec2-user
            IdentityFile ~/.ssh/ec2.pem
          Host target
            HostName ${{ secrets[matrix.host_secret] }}
            User ec2-user
            IdentityFile ~/.ssh/ec2.pem
            ProxyJump web
            StrictHostKeyChecking accept-new
          EOF

      - name: Copy deployment files
        run: |
          scp deploy/hosts/${{ matrix.role }}.yml target:/opt/portal/docker-compose.prod.yml
          scp deploy/scripts/deploy.sh target:/opt/portal/deploy.sh

      - name: Pull image and restart
        run: ssh target "chmod +x /opt/portal/deploy.sh && /opt/portal/deploy.sh ${{ github.sha }}"

      - name: Health check
        run: |
          ssh target 'bash -s' <<'EOF'
          cd /opt/portal
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T ${{ matrix.service }} sh -c "${{ matrix.health }}" >/dev/null 2>&1; then
              echo "OK   ${{ matrix.service }}"; exit 0
            fi
            sleep 10
          done
          echo "FAIL ${{ matrix.service }}"; docker compose -f docker-compose.prod.yml logs --tail 50 ${{ matrix.service }}; exit 1
          EOF

  deploy-web:
    name: Deploy web EC2
    runs-on: ubuntu-latest
    needs: deploy-backends
    if: github.event_name == 'push' && github.ref == 'refs/heads/add-JWT-config'
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host web
            HostName ${{ secrets.EC2_HOST }}
            User ec2-user
            IdentityFile ~/.ssh/ec2.pem
          EOF

      - name: Copy deployment files
        run: |
          scp deploy/hosts/web.yml web:/opt/portal/docker-compose.prod.yml
          scp deploy/scripts/deploy.sh web:/opt/portal/deploy.sh

      - name: Pull images and restart stack
        run: ssh web "chmod +x /opt/portal/deploy.sh && /opt/portal/deploy.sh ${{ github.sha }}"

      - name: Health check
        run: |
          ssh web 'bash -s' <<'EOF'
          set -e
          cd /opt/portal
          wait_for() {
            for i in $(seq 1 30); do
              if eval "$2" >/dev/null 2>&1; then echo "OK   $1"; return 0; fi
              sleep 10
            done
            echo "FAIL $1"; return 1
          }
          wait_for frontend "docker compose -f docker-compose.prod.yml exec -T frontend wget -qO- http://localhost/"
          # The web EC2 must reach each backend EC2 (security groups + private IPs in .env)
          for var in LOGIN_UPSTREAM PROJECT_UPSTREAM SCAN_UPSTREAM; do
            upstream="$(grep -E "^${var}=" .env | tail -1 | cut -d= -f2-)"
            wait_for "$var ($upstream)" "curl -fs http://$upstream/health"
          done
          EOF
