name: Combined Security Scans (Separate Frontend/Backend)

on:
  push:
    branches: [main, fix-vulnerabilities]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: nusiss_projectmanagementportal

jobs:
# =============================================
# SNYK SCANS 
# =============================================
  backend-snyk:
   name: Backend Snyk Scans
   runs-on: ubuntu-latest
   strategy:
     matrix:
       service:
         - name: login
           path: project-portal-backend/springBoot_login/demo
         - name: project
           path: project-portal-backend/springBoot_project/demo
         - name: scan
           path: project-portal-backend/springBoot_scan/demo
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Java
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: 17

     - name: Install Maven
       run: sudo apt-get update && sudo apt-get install -y maven

     - name: Cache Maven dependencies
       uses: actions/cache@v4
       with:
         path: ~/.m2
         key: ${{ runner.os }}-m2-${{ hashFiles(format('{0}/pom.xml', matrix.service.path)) }}
         restore-keys: ${{ runner.os }}-m2

     - name: Remove Maven wrapper files
       working-directory: ${{ matrix.service.path }}
       run: |
         mv mvnw mvnw.bak 2>/dev/null || echo "No mvnw file found"
         mv mvnw.cmd mvnw.cmd.bak 2>/dev/null || echo "No mvnw.cmd file found"
         echo "Maven wrapper files renamed. Snyk will use system Maven."

     - name: Install Snyk globally
       run: npm install -g snyk

     - name: Authenticate Snyk
       run: snyk auth ${{ env.SNYK_TOKEN }}

     - name: Verify Snyk
       run: snyk whoami

     - name: Run Snyk test (${{ matrix.service.name }})
       timeout-minutes: 20
       working-directory: ${{ matrix.service.path }}
       continue-on-error: true
       run: |
         export NODE_OPTIONS="--max-old-space-size=8192"
         snyk test --file=pom.xml --severity-threshold=high --fail-on=upgradable --print-dep -d
       env:
         NODE_OPTIONS: "--max-old-space-size=8192"
         SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

     - name: Snyk monitor (${{ matrix.service.name }})
       if: github.event_name == 'push'
       working-directory: ${{ matrix.service.path }}
       run: snyk monitor --file=pom.xml --project-name=${{ github.repository }}-${{ matrix.service.name }}
       env:
         SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

     - name: Restore Maven wrapper files
       if: always()
       working-directory: ${{ matrix.service.path }}
       run: |
         mv mvnw.bak mvnw 2>/dev/null || true
         mv mvnw.cmd.bak mvnw.cmd 2>/dev/null || true

  frontend-snyk:
   name: Frontend Snyk Scan
   runs-on: ubuntu-latest
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Node.js
       uses: actions/setup-node@v4
       with:
         node-version: 20
         cache: 'npm'
         cache-dependency-path: project-portal-frontend/package-lock.json

     - name: Install dependencies
       working-directory: project-portal-frontend
       run: npm ci

     - name: Install Snyk globally
       run: npm install -g snyk

     - name: Authenticate Snyk
       run: snyk auth ${{ env.SNYK_TOKEN }}

     - name: Verify Snyk
       run: snyk whoami

     - name: Snyk test (Frontend)
       working-directory: project-portal-frontend
       run: |
         export NODE_OPTIONS="--max-old-space-size=8192"
         snyk test --severity-threshold=high --fail-on=upgradable -d
       env:
         SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

     - name: Snyk monitor (Frontend)
       if: github.event_name == 'push'
       working-directory: project-portal-frontend
       run: snyk monitor --project-name=${{ github.repository }}-frontend
       env:
         SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

  dependency-scan:
   name: Consolidated Dependency Scan
   runs-on: ubuntu-latest
   needs: [backend-snyk, frontend-snyk]
   if: always()
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Java
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: 17

     - name: Setup Node.js
       uses: actions/setup-node@v4
       with:
         node-version: 20

     - name: Install Maven
       run: sudo apt-get update && sudo apt-get install -y maven

     - name: Install Snyk globally
       run: npm install -g snyk

     - name: Authenticate Snyk
       run: snyk auth ${{ secrets.SNYK_TOKEN }}

     - name: Verify Snyk
       run: snyk --version

     - name: Scan Login Service
       working-directory: project-portal-backend/springBoot_login/demo
       run: |
         mv mvnw mvnw.bak 2>/dev/null || true
         snyk test --file=pom.xml --severity-threshold=high --debug || true
         mv mvnw.bak mvnw 2>/dev/null || true
       env:
         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
       continue-on-error: true

     - name: Scan Project Service
       working-directory: project-portal-backend/springBoot_project/demo
       run: |
         mv mvnw mvnw.bak 2>/dev/null || true
         snyk test --file=pom.xml --severity-threshold=high --debug || true
         mv mvnw.bak mvnw 2>/dev/null || true
       env:
         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
       continue-on-error: true

     - name: Scan Scan Service
       working-directory: project-portal-backend/springBoot_scan/demo
       run: |
         mv mvnw mvnw.bak 2>/dev/null || true
         snyk test --file=pom.xml --severity-threshold=high --debug || true
         mv mvnw.bak mvnw 2>/dev/null || true
       env:
         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
       continue-on-error: true

     - name: Scan Frontend
       working-directory: project-portal-frontend
       run: snyk test --severity-threshold=high --debug || true
       env:
         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
       continue-on-error: true

  # =============================================
  # SONARCLOUD SCAN — single shared project covering the whole repo
  # (backend services + frontend analyzed together in one pass, rather
  # than 4 separate projects, since concurrent scans to different keys
  # would just overwrite each other under one project anyway)
  # =============================================
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: project-portal-frontend/package-lock.json

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('project-portal-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # mvn test compiles the code (full semantic analysis via sonar.java.binaries) and runs the
      # unit tests with JaCoCo, producing target/site/jacoco/jacoco.xml for Sonar coverage.
      - name: Test login-service with coverage
        working-directory: project-portal-backend/springBoot_login/demo
        run: mvn -B test

      - name: Test project-service with coverage
        working-directory: project-portal-backend/springBoot_project/demo
        run: mvn -B test

      - name: Test scan-service with coverage
        working-directory: project-portal-backend/springBoot_scan/demo
        run: mvn -B test

      - name: Install frontend dependencies
        working-directory: project-portal-frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: project-portal-frontend
        run: CI=true npm test -- --coverage --watchAll=false

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONARCLOUD_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONARCLOUD_ORGANIZATION }}
            -Dsonar.sources=project-portal-backend/springBoot_login/demo/src/main,project-portal-backend/springBoot_project/demo/src/main,project-portal-backend/springBoot_scan/demo/src/main,project-portal-frontend/src
            -Dsonar.tests=project-portal-backend/springBoot_login/demo/src/test,project-portal-backend/springBoot_project/demo/src/test,project-portal-backend/springBoot_scan/demo/src/test,project-portal-frontend/src
            -Dsonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.test.ts,**/*.test.tsx
            -Dsonar.java.binaries=project-portal-backend/springBoot_login/demo/target/classes,project-portal-backend/springBoot_project/demo/target/classes,project-portal-backend/springBoot_scan/demo/target/classes
            -Dsonar.java.test.binaries=project-portal-backend/springBoot_login/demo/target/test-classes,project-portal-backend/springBoot_project/demo/target/test-classes,project-portal-backend/springBoot_scan/demo/target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=project-portal-backend/springBoot_login/demo/target/site/jacoco/jacoco.xml,project-portal-backend/springBoot_project/demo/target/site/jacoco/jacoco.xml,project-portal-backend/springBoot_scan/demo/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=project-portal-frontend/coverage/lcov.info
            -Dsonar.coverage.exclusions=**/dto/**,**/entity/**,**/config/**,**/*Application.java,**/ClaudeService.java,**/DeepSeekService.java,**/index.tsx,**/reportWebVitals.ts,**/types/**
            -Dsonar.cpd.exclusions=**/dto/**,**/entity/**,**/config/**,**/security/JwtUtil.java,**/security/JwtAuthenticationFilter.java
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # =============================================
  # BACKEND UNIT TESTS — runs mvn test for each service in parallel
  # =============================================
  backend-tests:
    name: Backend Maven Tests (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: login
            path: project-portal-backend/springBoot_login/demo
          - name: project
            path: project-portal-backend/springBoot_project/demo
          - name: scan
            path: project-portal-backend/springBoot_scan/demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('{0}/pom.xml', matrix.service.path)) }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run unit tests (${{ matrix.service.name }})
        working-directory: ${{ matrix.service.path }}
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/target/surefire-reports
          if-no-files-found: ignore

  # =============================================
  # DOCKER BUILD & PUSH TO ECR
  # =============================================
  docker-build-push:
    name: Build Docker Images & Push to ECR
    runs-on: ubuntu-latest
    needs: [backend-snyk, frontend-snyk]  # Uncomment when Snyk scans are re-enabled
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Login Service
      - name: Build, tag, and push login-service
        working-directory: project-portal-backend/springBoot_login/demo
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:login-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:login-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-latest
          docker tag ${{ env.ECR_REPOSITORY }}:login-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-${{ github.sha }}

      # Project Service
      - name: Build, tag, and push project-service
        working-directory: project-portal-backend/springBoot_project/demo
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:project-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:project-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-latest
          docker tag ${{ env.ECR_REPOSITORY }}:project-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-${{ github.sha }}

      # Scan Service
      - name: Build, tag, and push scan-service
        working-directory: project-portal-backend/springBoot_scan/demo
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:scan-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:scan-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-latest
          docker tag ${{ env.ECR_REPOSITORY }}:scan-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-${{ github.sha }}

      # Frontend
      - name: Build, tag, and push frontend
        working-directory: project-portal-frontend
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:frontend-latest .
          docker tag ${{ env.ECR_REPOSITORY }}:frontend-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-latest
          docker tag ${{ env.ECR_REPOSITORY }}:frontend-latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}

      - name: Output image URIs
        run: |
          echo "Login Service: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:login-${{ github.sha }}"
          echo "Project Service: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:project-${{ github.sha }}"
          echo "Scan Service: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:scan-${{ github.sha }}"
          echo "Frontend: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}"
