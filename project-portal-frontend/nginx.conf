server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are held in variables so they are resolved
    # per request and nginx still starts if a backend is not up yet.
    # ${...} values are filled from environment variables when the container starts
    # (nginx image template feature); defaults are set in the Dockerfile.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $login_upstream   ${LOGIN_UPSTREAM};
    set $project_upstream ${PROJECT_UPSTREAM};
    set $scan_upstream    ${SCAN_UPSTREAM};

    # Keep the browser's Host so Spring sees API calls as same-origin (no CORS rejection)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login service: /api/auth/*, /api/login/*
    location ~ ^/api/(auth|login)(/|$) {
        proxy_pass http://$login_upstream;
    }

    # Project service: /api/projects/*
    location ~ ^/api/projects(/|$) {
        proxy_pass http://$project_upstream;
    }

    # Scan service: /api/scans/*, /api/github/* (scans can run for minutes)
    location ~ ^/api/(scans|github)(/|$) {
        proxy_pass http://$scan_upstream;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
