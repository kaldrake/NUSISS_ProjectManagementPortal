# EC2 #1 "web" (Elastic IP): frontend/Nginx (public :80) + SonarQube (:9001) and its PostgreSQL.
# Nginx proxies /api/* to the backend EC2s at LOGIN_UPSTREAM / PROJECT_UPSTREAM / SCAN_UPSTREAM.
# CI copies this file to /opt/portal/docker-compose.prod.yml; secrets come from /opt/portal/.env.

name: portal

services:
  sonar-db:
    image: postgres:13
    container_name: portal-sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Host port 9001: your IP and the scan EC2 only (security groups)
  sonarqube:
    image: sonarqube:9.9.5-community
    container_name: portal-sonarqube
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - portal-network

  frontend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-nusiss_projectmanagementportal}:frontend-${IMAGE_TAG:-latest}
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - LOGIN_UPSTREAM=${LOGIN_UPSTREAM:?Set LOGIN_UPSTREAM (e.g. login.portal.internal:8081) in .env}
      - PROJECT_UPSTREAM=${PROJECT_UPSTREAM:?Set PROJECT_UPSTREAM (e.g. project.portal.internal:8082) in .env}
      - SCAN_UPSTREAM=${SCAN_UPSTREAM:?Set SCAN_UPSTREAM (e.g. scan.portal.internal:8083) in .env}
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
