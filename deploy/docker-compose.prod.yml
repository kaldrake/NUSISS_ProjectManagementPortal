# Production stack for the single EC2 Docker host (see docs/Architecture.mermaid).
# Images come from ECR; secrets come from /opt/portal/.env on the EC2 (see .env.example).
# Only the frontend (port 80) is public: Nginx proxies /api/* to the backend services.
# login_db / project_db / scan_db live on Amazon RDS (MySQL 8.4) at ${DB_HOST}.

name: portal

services:
  # =============================================
  # PostgreSQL for SonarQube
  # =============================================
  sonar-db:
    image: postgres:13
    container_name: portal-sonar-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # SonarQube Server (host port 9001 - restrict in the security group)
  # =============================================
  sonarqube:
    image: sonarqube:9.9.5-community
    container_name: portal-sonarqube
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - portal-network

  # =============================================
  # Login Service (8081, internal only)
  # =============================================
  login-service:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-nusiss_projectmanagementportal}:login-${IMAGE_TAG:-latest}
    container_name: portal-login-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:?Set DB_HOST in .env}:3306/login_db?sslMode=REQUIRED&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=login_user
      - SPRING_DATASOURCE_PASSWORD=${LOGIN_DB_PASSWORD}
      # Creates tables on an empty database; no separate DDL step needed
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - JAVA_TOOL_OPTIONS=-Xmx384m
    networks:
      - portal-network

  # =============================================
  # Project Service (8082, internal only)
  # =============================================
  project-service:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-nusiss_projectmanagementportal}:project-${IMAGE_TAG:-latest}
    container_name: portal-project-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:?Set DB_HOST in .env}:3306/project_db?sslMode=REQUIRED&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=project_user
      - SPRING_DATASOURCE_PASSWORD=${PROJECT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SCAN_SERVICE_URL=http://scan-service:8083
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - JAVA_TOOL_OPTIONS=-Xmx384m
    depends_on:
      login-service:
        condition: service_started
      scan-service:
        condition: service_started
    networks:
      - portal-network

  # =============================================
  # Scan Service (8083, internal only)
  # =============================================
  scan-service:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-nusiss_projectmanagementportal}:scan-${IMAGE_TAG:-latest}
    container_name: portal-scan-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST:?Set DB_HOST in .env}:3306/scan_db?sslMode=REQUIRED&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=scan_user
      - SPRING_DATASOURCE_PASSWORD=${SCAN_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_TOKEN:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      # Also applies to the sonar-scanner CLI JVM launched inside this container
      - JAVA_TOOL_OPTIONS=-Xmx512m
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - portal-network

  # =============================================
  # Frontend + reverse proxy (public port 80)
  # =============================================
  frontend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-nusiss_projectmanagementportal}:frontend-${IMAGE_TAG:-latest}
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - login-service
      - project-service
      - scan-service
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
